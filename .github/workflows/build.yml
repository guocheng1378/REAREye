name: Build and Release

on:
  push:
    branches: [ "master", "main", "dev", "feature/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      #- name: Set up JDK 21
      #  uses: actions/setup-java@v5
      #  with:
      #    java-version: "21"
      #    distribution: "temurin"
      #    cache: gradle

      - name: Setup Android SDK
        uses: amyu/setup-android@v5
        with:
          distribution: "zulu"
          java-version: "21"
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          # Accept licenses first
          yes | sdkmanager --licenses 2>/dev/null || true
          # Try building; on first run Gradle auto-installs android-37.0
          ./gradlew assembleDebug -PbuildSuffix=canary || {
            # If failed due to android-37 missing, create symlink and retry
            echo "=== Retry: fixing SDK path ==="
            ls -la "$ANDROID_HOME/platforms/" 2>/dev/null || true
            if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
              ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
              echo "Symlink created, retrying build..."
              ./gradlew assembleDebug -PbuildSuffix=canary
            else
              echo "ERROR: android-37.0 not found"
              exit 1
            fi
          }

      - name: Build and Sign Release APK
        run: ./gradlew assembleRelease -PbuildSuffix=canary

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
